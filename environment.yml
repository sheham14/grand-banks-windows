# Python environment for the Docker image (sr3 subscribers + ingest job).
#
# Versions are pinned to what the local `gbw` micromamba environment had
# when the code was tested on 2026-10-28, so the laptop and the VM run
# the same thing. conda-forge, because ecCodes is a C library that pip
# doesn't install reliably.
name: base
channels:
  - conda-forge
dependencies:
  - python=3.12
  - eccodes=2.50.0          # the C library that decodes GRIB
  - python-eccodes=2.50.0   # its Python bindings (import eccodes)
  - numpy=2.5.4             # arrays; the extractor's site lookup uses it directly
                            # (pinned 2026-11-01 to the local gbw version)
  - psycopg=3.3.4           # Postgres driver
  - pyyaml=6.0.3            # config/*.yaml
  - python-dotenv=1.2.4     # reads .env when run outside Docker
  # The web API (build step 8, api/main.py). fastapi-core is FastAPI
  # alone; the plain "fastapi" package also pulls in a command-line tool
  # and telemetry libraries we don't use. Pinned 2026-11-03.
  - fastapi-core=0.162.0
  - uvicorn=0.54.0          # the web server that runs the FastAPI app
  # (The tests also need httpx2, for FastAPI's TestClient. Tests run in the
  # local gbw environment, not in this image, so it isn't listed here.)
  - pip
  - pip:
      - metpx-sr3==3.3.1    # ECCC's sr3 client (not on conda-forge)
      - amqp==5.4.1         # lets sr3 talk to the AMQP broker
