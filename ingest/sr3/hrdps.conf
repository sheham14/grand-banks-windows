# HRDPS 10 m wind for every run (build step 3).
# One run is ~20,600 files; only the 4 x 49 we need pass the accept filter.

broker amqps://dd.weather.gc.ca/
topicPrefix v02.post
expire 1d
subtopic *.WXO-DD.model_hrdps.continental.2.5km.#

acceptUnmatched False
accept .*_MSC_HRDPS_(UGRD|VGRD|WIND|WDIR)_AGL-10m_.*\.grib2$

directory /home/sheha/grand-banks-windows/data/raw/hrdps
download on
