# Raw SWOB-ML archive for the moored buoys we care about (build step 4).
# 44139 Banquereau Bank is live; 44251, 44138 and 44140 are silent as of
# 2026-10-26 and kept so we notice if they come back on station.
# Datamart folders use 7-digit IDs: 44139 -> 4400139.

broker amqps://dd.weather.gc.ca/
topicPrefix v02.post
expire 1d
subtopic *.WXO-DD.observations.swob-ml.marine.moored-buoys.#

# directory must come before accept: sr3 applies it only to the
# accept lines that follow it. The path is inside the container; Compose
# mounts the repo's ./data folder at /app/data.
directory /app/data/raw/swob

acceptUnmatched False
accept .*-(4400139|4400251|4400138|4400140)-AUTO-swob\.xml

download on
