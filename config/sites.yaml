# Points the pipeline extracts forecasts for.
#
# Coordinates are decimal degrees. North and east are positive,
# so every longitude here is negative (west).
#
# role:
#   forecast      we produce forecasts here; no live observations to check against
#   verification  a live buoy we score forecasts against. Scoring is Phase 2a;
#                 forecasts are stored from now on so it starts with history.

sites:
  - id: nickerson_bank
    name: Nickerson Bank
    lat: 46.44
    lon: -53.39
    role: forecast
    buoy_id: "44251"
    note: ECCC buoy, silent as of 2026-10-26, so no live verification here.

  - id: wsp_grand_banks
    name: WSP Grand Banks (Waypoint 3)
    lat: 47.24
    lon: -50.95
    role: forecast
    note: WSP wave buoy, data only for 2022-03-01 to 2022-04-30 (Phase 2b hindcast).

  - id: banquereau_bank
    name: Banquereau Bank
    # Read from the buoy's own SWOB-ML files: the same value in all 103
    # received from 2026-10-28 to 2026-11-02.
    lat: 44.24
    lon: -57.103333
    role: verification
    buoy_id: "44139"
    note: ECCC moored buoy, reporting hourly. 379 km from Nickerson Bank and 582 km from the WSP site, so not on the Grand Banks themselves.

  - id: st_johns_smartatlantic
    name: St. John's approach (SmartAtlantic, coastal)
    # Read from the buoy's own ERDDAP rows: the same latitude/longitude
    # in every row (checked 2026-11-05). Its precise_lat/precise_lon
    # columns wander about 250 m as it swings on its mooring.
    lat: 47.56716
    lon: -52.630578
    role: verification
    # Not read by any code yet (like buoy_id above); the buoy parser in
    # Phase 2a step 4 will use it. Query it at www.smartatlantic.ca/erddap:
    # CIOOS Atlantic redirects data requests there.
    erddap_dataset: SMA_st_johns
    note: SmartAtlantic buoy at the St. John's harbour approach, reporting half-hourly. Coastal, so not comparable with the offshore sites. Nearest RDWPS point is sea, 0.83 km away (hand check 2026-11-05). 138 km from Nickerson Bank, 132 km from the WSP site.
